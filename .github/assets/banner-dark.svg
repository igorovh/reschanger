    <radialGradient id="glow" cx="1080" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="160" cy="320" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="#0B0D14"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
